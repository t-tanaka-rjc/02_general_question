# エラーレベル:1（エラー）
## 登録/更新失敗
upsertError=データを更新できませんでした
## 削除失敗
deleteError=データを削除できませんでした
## 対象抽出失敗
targetInvalidError=対象が存在しません、または削除されています
## 特定のデータ取得失敗
dataMissingError=役職か事業所に関連するデータが読み取れません、または削除されています
## 不正アクセス
accessError=アクセス権限がありません
## ファイル出力失敗
fileOutputError=ファイルの出力に失敗しました

# エラーレベル:4（インフォメーション）
## 登録/更新成功
upsertSuccess=データを更新しました
## 削除成功
deleteSuccess=データを削除しました


# 共通項目
tel1=電話番号 